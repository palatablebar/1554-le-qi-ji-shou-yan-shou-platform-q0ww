name: mlworkbench-instrumentdesk
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-18653}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
